  ollama:
    image: ollama/ollama
    container_name: ollama
    build:
      context: .
      dockerfile: ollama.Dockerfile
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    runtime: nvidia
    deploy: 
      resources: 
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

